name: Build
on:
  push:
    branches:
    - master
    - "[0-9]+_[0-9]+_X"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '24', '26' ]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
        name: Install dependencies

      - run: npm test
        name: Build

      - run: npm pack
        name: Package
        if: matrix.node == '24'

      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: liveview
          path: liveview-*.tgz
